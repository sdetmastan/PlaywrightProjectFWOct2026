# ═══════════════════════════════════════════════════════════════
# FILE: .github/workflows/master-pipeline.yml
# REPO: naveenanimation20/OpenCartWebAPIFramework
# DEV REPO: jglick/simple-maven-project-with-tests
# ═══════════════════════════════════════════════════════════════

name: e2e CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Run up to environment'
        required: true
        default: 'QA'
        type: choice
        options:
          - dev
          - QA
          - stage
          - Prod

jobs:

  # ═════════════════════════════════════════════════════
  # STEP 1: BUILD APP + UNIT TESTS (DEV REPO - MAVEN)
  # ═════════════════════════════════════════════════════
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEV repo
        uses: actions/checkout@v4
        with:
          repository: jglick/simple-maven-project-with-tests

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build & Run Unit Tests
        run: |
          echo "========================================="
          echo "  Building App + Running Unit Tests"
          echo "========================================="
          mvn clean install -Dmaven.test.failure.ignore=true

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: target/surefire-reports/
          retention-days: 30

  # ═════════════════════════════════════════════════════
  # STEP 2: DEPLOY DEV + SANITY TESTS
  # ═════════════════════════════════════════════════════
  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DEV
        run: echo "Deployed to DEV ✅"

  sanity-dev:
    name: DEV - Sanity Tests
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout QA repo
        uses: actions/checkout@v4
        with:
          repository: sdetmastan/PlaywrightProjectFWOct2026

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache Playwright browsers
        id: pw-cache-dev
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.pw-cache-dev.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only
        if: steps.pw-cache-dev.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Sanity Tests on DEV
        run: |
          echo "========================================="
          echo "  Running SANITY @smoke on DEV"
          echo "========================================="
          npx playwright test --project=chromium --grep @smoke
        env:
          ENV: dev
          BASE_URL: ${{ secrets.BASE_URL }}
          APPUSERNAME: ${{ secrets.APPUSERNAME }}
          APPPASSWORD: ${{ secrets.APPPASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          GRANT_TYPE: ${{ secrets.GRANT_TYPE }}

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload DEV HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-sanity-html-report
          path: reports/html-report/
          retention-days: 30

      - name: Upload DEV Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-sanity-allure-report
          path: allure-report/
          retention-days: 30
